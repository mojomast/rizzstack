# An unpinned checkout of the pull request head.  Must be refused.
name: gate-authority
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  gate-authority:
    name: gate-authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: fetch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
      - name: judge
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/lease_tamper.py
