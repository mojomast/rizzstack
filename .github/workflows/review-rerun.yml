name: review rerun

# A submitted or dismissed review changes what the base gate answers, so re-run
# the newest pull_request_target gate-authority run for this pull request at its
# exact head, whatever its conclusion: a later rejection must be able to turn a
# green gate red.  A failed lease-tamper job on a pull_request run is re-run too.

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  actions: write

jobs:
  rerun-base-gate:
    name: rerun base gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Re-run the base-pinned gate and any failed lease-tamper job
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gate_runs=$(gh api --paginate --slurp \
            "repos/$REPO/actions/workflows/gate-authority.yml/runs?event=pull_request_target&per_page=100")
          gate_id=$(printf '%s' "$gate_runs" | jq -r --argjson pr "$PR_NUMBER" --arg head "$HEAD_SHA" '
            [.[].workflow_runs[]
             | select(.path == ".github/workflows/gate-authority.yml")
             | select(.status == "completed")
             | select(any(.pull_requests[]?; .number == $pr and (.head.sha // "") == $head))]
            | sort_by([.created_at, .id]) | last | .id // empty')
          if [ -n "$gate_id" ]; then
            echo "rerun base gate: $gate_id"
            gh api -X POST "repos/$REPO/actions/runs/$gate_id/rerun"
          fi
          head_runs=$(gh api --paginate --slurp \
            "repos/$REPO/actions/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=100")
          run_ids=$(printf '%s' "$head_runs" | jq -r --argjson pr "$PR_NUMBER" '
            [.[].workflow_runs[]
             | select(.status == "completed" and .conclusion == "failure")
             | select(any(.pull_requests[]?; .number == $pr))
             | .id] | unique | .[]')
          for run in $run_ids; do
            jobs=$(gh api --paginate --slurp \
              "repos/$REPO/actions/runs/$run/jobs?per_page=100")
            job_ids=$(printf '%s' "$jobs" | jq -r '
              [.[].jobs[]
               | select(.conclusion == "failure")
               | select(.name == "lease-tamper")
               | .id] | unique | .[]')
            for job in $job_ids; do
              echo "rerun gate job: $job (run $run)"
              gh api -X POST "repos/$REPO/actions/jobs/$job/rerun"
            done
          done
