name: gitleaks

# Secret scan over full history (rizzstack/codemap/ci-gates.md: gitleaks runs in
# CI and locally before every push), plus a check that every workflow here keeps
# the shared hygiene rules: actions pinned by SHA, read-only token, no persisted
# credentials. Kept separate from codemap.yml, which only runs on codemap paths.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.21.2 (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan history
        run: ./gitleaks detect --source . --redact --no-banner

  workflow-hygiene:
    name: workflow hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Workflow contract tests
        run: python3 -m unittest discover -s tests -v

  ci-gate:
    name: ci-gate
    # The main ruleset requires this one check. It passes only when every job
    # in this file succeeded, so new jobs must be added to needs (checked below).
    if: ${{ always() }}
    needs:
      - secret-scan
      - workflow-hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ci-gate needs every job in this file
        run: python3 .github/scripts/check_ci_gate.py .github/workflows/gitleaks.yml
      - name: Fail unless every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {job: data["result"] for job, data in json.loads(os.environ["NEEDS"]).items()}
          for job, result in sorted(results.items()):
              print(f"{job}: {result}")
          failed = sorted(job for job, result in results.items() if result != "success")
          if failed or not results:
              print("ci-gate FAILED: " + (", ".join(failed) or "no jobs"))
              sys.exit(1)
          PY
